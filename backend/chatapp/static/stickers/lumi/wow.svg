<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Wow"><title>Wow</title><style>.eyes,.pulse,.tw,.tw2,.spin,.bob,.rise,.rise2,.rise3,.drip,.flash,.hop,.shake,.breathe,.bounce,.fall,.fall2,.tilt{transform-box:fill-box;transform-origin:50% 50%}.hop,.shake,.breathe,.bounce,.tilt{transform-origin:50% 100%}.eyes{animation:blink 2.6s ease-in-out 3}@keyframes blink{0%,86%,100%{transform:scaleY(1)}91%{transform:scaleY(.12)}}.tw{animation:twinkle 1.3s ease-in-out 4}.tw2{animation:twinkle 1.3s ease-in-out .45s 4}@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.45);opacity:.5}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.hop{animation:hop 1s cubic-bezier(.3,.7,.4,1) 3}@keyframes hop{0%,55%,100%{transform:translateY(0) scale(1)}20%{transform:translateY(-12px) scale(1.03,.97)}}.flash{animation:flash 1s ease-in-out 3}@keyframes flash{0%,100%{opacity:1;transform:scale(1)}20%{opacity:.2;transform:scale(.8)}}#once:target,#once:target *{animation-iteration-count:1!important}</style><g id="once"><g class="hop"><path d="M128 56c50 0 84 34 84 84 0 48-34 76-84 76s-84-28-84-76c0-50 34-84 84-84z" fill="#17324a"/><path d="M150 62c8-24 32-32 50-24-4 20-26 34-50 24z" fill="#ecb1d0"/><path d="M150 62c14-6 28-14 40-20" stroke="#17324a" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="102" cy="216" rx="20" ry="9" fill="#1b7f79"/><ellipse cx="154" cy="216" rx="20" ry="9" fill="#1b7f79"/><g transform="translate(60 140) rotate(210)"><rect x="-4" y="-11" width="38" height="22" rx="11" fill="#17324a"/><circle cx="30" cy="0" r="12" fill="#1b7f79"/></g><g transform="translate(196 140) rotate(-30)"><rect x="-4" y="-11" width="38" height="22" rx="11" fill="#17324a"/><circle cx="30" cy="0" r="12" fill="#1b7f79"/></g><ellipse cx="104" cy="126" rx="16" ry="19" fill="#fffdfa"/><ellipse cx="152" cy="126" rx="16" ry="19" fill="#fffdfa"/><circle cx="104" cy="127" r="6" fill="#0d1c2b"/><circle cx="152" cy="127" r="6" fill="#0d1c2b"/><ellipse cx="82" cy="156" rx="11" ry="6" fill="#ecb1d0" opacity=".85"/><ellipse cx="174" cy="156" rx="11" ry="6" fill="#ecb1d0" opacity=".85"/><ellipse cx="128" cy="168" rx="11" ry="14" fill="#0d1c2b"/></g><g class="flash"><path d="M128 18v22M88 30l10 18M168 30l-10 18" stroke="#f2b93b" stroke-width="7" stroke-linecap="round"/></g></g></svg>
