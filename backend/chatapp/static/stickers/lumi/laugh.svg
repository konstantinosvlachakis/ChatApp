<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Haha"><title>Haha</title><style>.eyes,.pulse,.tw,.tw2,.spin,.bob,.rise,.rise2,.rise3,.drip,.flash,.hop,.shake,.breathe,.bounce,.fall,.fall2,.tilt{transform-box:fill-box;transform-origin:50% 50%}.hop,.shake,.breathe,.bounce,.tilt{transform-origin:50% 100%}.eyes{animation:blink 2.6s ease-in-out 3}@keyframes blink{0%,86%,100%{transform:scaleY(1)}91%{transform:scaleY(.12)}}.tw{animation:twinkle 1.3s ease-in-out 4}.tw2{animation:twinkle 1.3s ease-in-out .45s 4}@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.45);opacity:.5}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.shake{animation:shake .5s ease-in-out 7}@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}.drip{animation:drip 1s ease-in 4}@keyframes drip{0%,100%{transform:translateY(0);opacity:1}60%{transform:translateY(8px);opacity:.3}}#once:target,#once:target *{animation-iteration-count:1!important}</style><g id="once"><g class="shake"><path d="M128 56c50 0 84 34 84 84 0 48-34 76-84 76s-84-28-84-76c0-50 34-84 84-84z" fill="#17324a"/><path d="M150 62c8-24 32-32 50-24-4 20-26 34-50 24z" fill="#ecb1d0"/><path d="M150 62c14-6 28-14 40-20" stroke="#17324a" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="102" cy="216" rx="20" ry="9" fill="#1b7f79"/><ellipse cx="154" cy="216" rx="20" ry="9" fill="#1b7f79"/><g transform="translate(60 150) rotate(200)"><rect x="-4" y="-11" width="34" height="22" rx="11" fill="#17324a"/><circle cx="26" cy="0" r="12" fill="#1b7f79"/></g><g transform="translate(196 150) rotate(-20)"><rect x="-4" y="-11" width="34" height="22" rx="11" fill="#17324a"/><circle cx="26" cy="0" r="12" fill="#1b7f79"/></g><path d="M92 132q12-16 24 0" stroke="#fffdfa" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M140 132q12-16 24 0" stroke="#fffdfa" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="82" cy="156" rx="11" ry="6" fill="#ecb1d0" opacity=".85"/><ellipse cx="174" cy="156" rx="11" ry="6" fill="#ecb1d0" opacity=".85"/><path d="M100 152q28 46 56 0z" fill="#0d1c2b"/><path d="M112 170q16 14 32 0q-16-8-32 0z" fill="#e05a47"/><g class="drip"><path d="M84 140q-10 12-4 20q8 2 8-8z" fill="#8fd3e8"/><path d="M172 140q10 12 4 20q-8 2-8-8z" fill="#8fd3e8"/></g></g></g></svg>
