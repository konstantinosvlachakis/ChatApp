<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Party"><title>Party</title><style>.eyes,.pulse,.tw,.tw2,.spin,.bob,.rise,.rise2,.rise3,.drip,.flash,.hop,.shake,.breathe,.bounce,.fall,.fall2,.tilt{transform-box:fill-box;transform-origin:50% 50%}.hop,.shake,.breathe,.bounce,.tilt{transform-origin:50% 100%}.eyes{animation:blink 2.6s ease-in-out 3}@keyframes blink{0%,86%,100%{transform:scaleY(1)}91%{transform:scaleY(.12)}}.tw{animation:twinkle 1.3s ease-in-out 4}.tw2{animation:twinkle 1.3s ease-in-out .45s 4}@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.45);opacity:.5}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.bounce{animation:bounce .7s ease-in-out 5}@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-10px) scale(1.02,.98)}}.fall{animation:confetti 1.4s ease-in 3}.fall2{animation:confetti 1.4s ease-in .5s 3}@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}75%{transform:translateY(16px) rotate(90deg);opacity:0}76%{transform:translateY(0) rotate(0);opacity:0}100%{transform:translateY(0) rotate(0);opacity:1}}#once:target,#once:target *{animation-iteration-count:1!important}</style><g id="once"><g class="fall"><rect x="40" y="40" width="10" height="16" rx="3" fill="#ecb1d0" transform="rotate(-20 45 48)"/><rect x="212" y="96" width="10" height="16" rx="3" fill="#f2b93b" transform="rotate(25 217 104)"/><circle cx="230" cy="150" r="5" fill="#ecb1d0"/></g><g class="fall2"><rect x="28" y="120" width="10" height="16" rx="3" fill="#1b7f79" transform="rotate(30 33 128)"/><circle cx="214" cy="40" r="6" fill="#1b7f79"/><circle cx="66" cy="18" r="5" fill="#f2b93b"/></g><g class="bounce"><path d="M128 56c50 0 84 34 84 84 0 48-34 76-84 76s-84-28-84-76c0-50 34-84 84-84z" fill="#17324a"/><path d="M150 62c8-24 32-32 50-24-4 20-26 34-50 24z" fill="#ecb1d0"/><path d="M150 62c14-6 28-14 40-20" stroke="#17324a" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="102" cy="216" rx="20" ry="9" fill="#1b7f79"/><ellipse cx="154" cy="216" rx="20" ry="9" fill="#1b7f79"/><path d="M102 66l30-56l26 50z" fill="#f2b93b"/><path d="M110 50l40 6M120 32l22 4" stroke="#e05a47" stroke-width="6" stroke-linecap="round"/><circle cx="132" cy="10" r="8" fill="#ecb1d0"/><g transform="translate(60 140) rotate(210)"><rect x="-4" y="-11" width="38" height="22" rx="11" fill="#17324a"/><circle cx="30" cy="0" r="12" fill="#1b7f79"/></g><g transform="translate(196 140) rotate(-30)"><rect x="-4" y="-11" width="38" height="22" rx="11" fill="#17324a"/><circle cx="30" cy="0" r="12" fill="#1b7f79"/></g><path d="M92 132q12-16 24 0" stroke="#fffdfa" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M140 132q12-16 24 0" stroke="#fffdfa" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="82" cy="156" rx="11" ry="6" fill="#ecb1d0" opacity=".85"/><ellipse cx="174" cy="156" rx="11" ry="6" fill="#ecb1d0" opacity=".85"/><path d="M108 156q20 30 40 0z" fill="#0d1c2b"/><path d="M116 166q12 10 24 0q-12-6-24 0z" fill="#e05a47"/></g></g></svg>
