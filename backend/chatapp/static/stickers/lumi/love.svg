<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Love it"><title>Love it</title><style>.eyes,.pulse,.tw,.tw2,.spin,.bob,.rise,.rise2,.rise3,.drip,.flash,.hop,.shake,.breathe,.bounce,.fall,.fall2,.tilt{transform-box:fill-box;transform-origin:50% 50%}.hop,.shake,.breathe,.bounce,.tilt{transform-origin:50% 100%}.eyes{animation:blink 2.6s ease-in-out 3}@keyframes blink{0%,86%,100%{transform:scaleY(1)}91%{transform:scaleY(.12)}}.tw{animation:twinkle 1.3s ease-in-out 4}.tw2{animation:twinkle 1.3s ease-in-out .45s 4}@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.45);opacity:.5}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.pulse{animation:pulse .9s ease-in-out 5}@keyframes pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.22)}}.rise{animation:rise 2s ease-out 3}.rise2{animation:rise 2s ease-out .6s 3}.rise3{animation:rise 2s ease-out 1.2s 3}@keyframes rise{0%{transform:translateY(0);opacity:1}70%{transform:translateY(-18px);opacity:0}71%{transform:translateY(0);opacity:0}100%{transform:translateY(0);opacity:1}}</style><path d="M128 56c50 0 84 34 84 84 0 48-34 76-84 76s-84-28-84-76c0-50 34-84 84-84z" fill="#17324a"/><path d="M150 62c8-24 32-32 50-24-4 20-26 34-50 24z" fill="#ecb1d0"/><path d="M150 62c14-6 28-14 40-20" stroke="#17324a" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="102" cy="216" rx="20" ry="9" fill="#1b7f79"/><ellipse cx="154" cy="216" rx="20" ry="9" fill="#1b7f79"/><g transform="translate(60 162) rotate(150)"><rect x="-4" y="-11" width="30" height="22" rx="11" fill="#17324a"/><circle cx="22" cy="0" r="12" fill="#1b7f79"/></g><g transform="translate(196 162) rotate(30)"><rect x="-4" y="-11" width="30" height="22" rx="11" fill="#17324a"/><circle cx="22" cy="0" r="12" fill="#1b7f79"/></g><g class="pulse"><path transform="translate(104 126) scale(1.5)" d="M0 8C-6 3-10 0-10-4a5 5 0 0 1 10-2 5 5 0 0 1 10 2c0 4-4 7-10 12z" fill="