<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Coffee chat"><title>Coffee chat</title><style>.eyes,.pulse,.tw,.tw2,.spin,.bob,.rise,.rise2,.rise3,.drip,.flash,.hop,.shake,.breathe,.bounce,.fall,.fall2,.tilt{transform-box:fill-box;transform-origin:50% 50%}.hop,.shake,.breathe,.bounce,.tilt{transform-origin:50% 100%}.eyes{animation:blink 2.6s ease-in-out 3}@keyframes blink{0%,86%,100%{transform:scaleY(1)}91%{transform:scaleY(.12)}}.tw{animation:twinkle 1.3s ease-in-out 4}.tw2{animation:twinkle 1.3s ease-in-out .45s 4}@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.45);opacity:.5}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.rise{animation:steam 1.6s ease-out 3}.rise2{animation:steam 1.6s ease-out .5s 3}@keyframes steam{0%{transform:translateY(0);opacity:1}70%{transform:translateY(-10px);opacity:0}71%{transform:translateY(0);opacity:0}100%{transform:translateY(0);opacity:1}}#once:target,#once:target *{animation-iteration-count:1!important}</style><g id="once"><path d="M128 56c50 0 84 34 84 84 0 48-34 76-84 76s-84-28-84-76c0-50 34-84 84-84z" fill="#17324a"/><path d="M150 62c8-24 32-32 50-24-4 20-26 34-50 24z" fill="#ecb1d0"/><path d="M150 62c14-6 28-14 40-20" stroke="#17324a" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="102" cy="216" rx="20" ry="9" fill="#1b7f79"/><ellipse cx="154" cy="216" rx="20" ry="9" fill="#1b7f79"/><g transform="translate(60 160) rotate(150)"><rect x="-4" y="-11" width="30" height="22" rx="11" fill="#17324a"/><circle cx="22" cy="0" r="12" fill="#1b7f79"/></g><g class="eyes"><ellipse cx="104" cy="128" rx="14" ry="17" fill="#fffdfa"/><ellipse cx="152" cy="128" rx="14" ry="17" fill="#fffdfa"/><circle cx="108" cy="131" r="8" fill="#0d1c2b"/><circle cx="156" cy="131" r="8" fill="#0d1c2b"/><circle cx="111" cy="127" r="2.6" fill="#fffdfa"/><circle cx="159" cy="127" r="2.6" fill="#fffdfa"/></g><ellipse cx="82" cy="156" rx="11" ry="6" fill="#ecb1d0" opacity=".85"/><ellipse cx="174" cy="156" rx="11" ry="6" fill="#ecb1d0" opacity=".85"/><path d="M112 158q16 14 32 0" stroke="#fffdfa" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M168 152h40v34q0 14-14 14h-12q-14 0-14-14z" fill="#f5cfb1" stroke="#0d1c2b" stroke-width="3"/><path d="M208 160q14 0 14 12t-14 12" stroke="#0d1c2b" stroke-width="5" fill="none"/><g class="rise"><path d="M178 140q-6-10 0-18t0-18" stroke="#1b7f79" stroke-width="5" fill="none" stroke-linecap="round"/></g><g class="rise2"><path d="M196 140q-6-10 0-18t0-18" stroke="#1b7f79" stroke-width="5" fill="none" stroke-linecap="round"/></g><circle cx="166" cy="176" r="11" fill="#1b7f79"/></g></svg>
