<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">LangVoyage architecture</title>
  <desc id="desc">Architecture diagram showing web browser and mobile app clients, the Heroku-hosted Django backend with Daphne, REST API, Channels WebSocket, AI coach, Whitenoise, and integrations with Postgres, Redis, Cloudinary, and Gemini.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4b5565; }
      .section-title { font-size: 16px; font-weight: 700; fill: #31425f; letter-spacing: 0.08em; text-transform: uppercase; }
      .box-title { font-size: 20px; font-weight: 700; }
      .box-copy { font-size: 15px; fill: #415065; }
      .small { font-size: 13px; fill: #5d6b7c; }
      .panel { fill: #f7f9fc; stroke: #d6deea; stroke-width: 2; }
      .panel-accent { fill: #eef4ff; stroke: #b9cbee; stroke-width: 2; }
      .client { fill: #f4fbf6; stroke: #9fc9ac; stroke-width: 2; }
      .service { fill: #ffffff; stroke: #9fb3cf; stroke-width: 2; }
      .data { fill: #fff8eb; stroke: #d7b779; stroke-width: 2; }
      .external { fill: #fff1f1; stroke: #d8a0a0; stroke-width: 2; }
      .arrow { stroke: #58708f; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #58708f; stroke-width: 3; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrowhead); }
      .label-bg { fill: #ffffff; }
      .edge-label { font-size: 13px; font-weight: 600; fill: #31425f; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#58708f" />
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#ffffff" />

  <text x="70" y="70" class="title">LangVoyage Current Architecture</text>
  <text x="70" y="102" class="subtitle">Clear view of the deployed web stack, the mobile scaffold, and the backend integrations reflected in this repository.</text>

  <rect x="60" y="140" width="300" height="700" rx="26" class="panel" />
  <text x="90" y="185" class="section-title">Clients</text>

  <rect x="90" y="230" width="240" height="180" rx="20" class="client" />
  <text x="120" y="275" class="box-title">Web Browser</text>
  <text x="120" y="305" class="box-copy">React SPA from `frontend/`</text>
  <text x="120" y="333" class="box-copy">Loads static build from Django</text>
  <text x="120" y="361" class="box-copy">Uses REST + WebSocket chat</text>

  <rect x="90" y="470" width="240" height="180" rx="20" class="client" />
  <text x="120" y="515" class="box-title">Mobile App</text>
  <text x="120" y="545" class="box-copy">Expo / React Native client</text>
  <text x="120" y="573" class="box-copy">Scaffold in `mobile/`</text>
  <text x="120" y="601" class="box-copy">Currently uses HTTPS API</text>

  <rect x="400" y="140" width="760" height="700" rx="26" class="panel-accent" />
  <text x="430" y="185" class="section-title">Heroku App</text>

  <rect x="430" y="220" width="700" height="110" rx="20" class="service" />
  <text x="460" y="268" class="box-title">Daphne ASGI Entry Point</text>
  <text x="460" y="298" class="box-copy">Single runtime entry for HTTP requests and WebSocket connections</text>

  <rect x="430" y="370" width="330" height="165" rx="20" class="service" />
  <text x="460" y="418" class="box-title">REST API</text>
  <text x="460" y="448" class="box-copy">Auth, profiles, discovery, conversations, uploads</text>
  <text x="460" y="476" class="small">Django + DRF + JWT/cookie auth</text>

  <rect x="800" y="370" width="330" height="165" rx="20" class="service" />
  <text x="830" y="418" class="box-title">Realtime Layer</text>
  <text x="830" y="448" class="box-copy">Channels WebSocket consumers</text>
  <text x="830" y="476" class="small">Chat messages, typing, presence</text>

  <rect x="430" y="585" width="330" height="165" rx="20" class="service" />
  <text x="460" y="633" class="box-title">Whitenoise Static Hosting</text>
  <text x="460" y="663" class="box-copy">Serves React build and compiled static assets</text>
  <text x="460" y="691" class="small">Frontend build is mounted into Django templates/staticfiles</text>

  <rect x="800" y="585" width="330" height="165" rx="20" class="service" />
  <text x="830" y="633" class="box-title">AI Coach Endpoint</text>
  <text x="830" y="663" class="box-copy">Backend route that sends coach prompts to Gemini</text>
  <text x="830" y="691" class="small">Rate limited and invoked over normal HTTPS</text>

  <rect x="1200" y="140" width="340" height="700" rx="26" class="panel" />
  <text x="1230" y="185" class="section-title">Data and Integrations</text>

  <rect x="1230" y="230" width="280" height="125" rx="20" class="data" />
  <text x="1260" y="275" class="box-title">Database</text>
  <text x="1260" y="305" class="box-copy">Postgres in production</text>
  <text x="1260" y="333" class="box-copy">SQLite in local development</text>

  <rect x="1230" y="390" width="280" height="125" rx="20" class="data" />
  <text x="1260" y="435" class="box-title">Redis / Cache</text>
  <text x="1260" y="465" class="box-copy">Channels layer and cache when enabled</text>
  <text x="1260" y="493" class="box-copy">In-memory fallback in local dev</text>

  <rect x="1230" y="550" width="280" height="125" rx="20" class="data" />
  <text x="1260" y="595" class="box-title">Media Storage</text>
  <text x="1260" y="625" class="box-copy">Cloudinary in production when configured</text>
  <text x="1260" y="653" class="box-copy">Local media fallback otherwise</text>

  <rect x="1230" y="710" width="280" height="125" rx="20" class="external" />
  <text x="1260" y="755" class="box-title">Gemini API</text>
  <text x="1260" y="785" class="box-copy">External model used by the AI coach</text>

  <path d="M 330 300 C 370 300, 390 300, 430 275" class="arrow" />
  <rect x="324" y="273" width="92" height="24" rx="12" class="label-bg" />
  <text x="334" y="290" class="edge-label">HTTPS + WSS</text>

  <path d="M 330 560 C 370 560, 390 560, 430 275" class="arrow" />
  <rect x="326" y="522" width="78" height="24" rx="12" class="label-bg" />
  <text x="336" y="539" class="edge-label">HTTPS</text>

  <path d="M 780 275 L 780 360" class="arrow" />
  <path d="M 780 275 C 860 275, 920 300, 965 360" class="arrow" />
  <path d="M 780 330 C 710 360, 640 470, 595 575" class="arrow" />
  <path d="M 780 330 C 860 365, 950 470, 965 575" class="arrow" />

  <path d="M 760 452 C 920 452, 1080 452, 1230 292" class="arrow" />
  <rect x="940" y="435" width="120" height="24" rx="12" class="label-bg" />
  <text x="950" y="452" class="edge-label">app data</text>

  <path d="M 760 480 C 940 500, 1080 500, 1230 452" class="arrow" />
  <rect x="960" y="493" width="136" height="24" rx="12" class="label-bg" />
  <text x="970" y="510" class="edge-label">cache + presence</text>

  <path d="M 1130 452 C 1170 452, 1190 452, 1230 452" class="arrow" />

  <path d="M 760 620 C 930 620, 1080 620, 1230 612" class="arrow" />
  <rect x="968" y="603" width="134" height="24" rx="12" class="label-bg" />
  <text x="978" y="620" class="edge-label">uploads / media</text>

  <path d="M 1130 667 C 1170 700, 1190 730, 1230 772" class="arrow" />
  <rect x="1120" y="700" width="82" height="24" rx="12" class="label-bg" />
  <text x="1130" y="717" class="edge-label">prompt</text>

  <path d="M 1230 612 C 1060 612, 760 220, 330 300" class="arrow-dashed" />
  <rect x="730" y="245" width="116" height="24" rx="12" class="label-bg" />
  <text x="740" y="262" class="edge-label">media URLs</text>

  <path d="M 1230 632 C 1050 660, 760 700, 330 560" class="arrow-dashed" />
  <rect x="792" y="676" width="116" height="24" rx="12" class="label-bg" />
  <text x="802" y="693" class="edge-label">media URLs</text>

  <text x="70" y="900" class="small">Source cues used for this diagram: `backend/core/settings.py`, `backend/core/asgi.py`, `Procfile`, `frontend/package.json`, `mobile/package.json`.</text>
  <text x="70" y="928" class="small">The mobile client is shown as the current scaffold in the repo, so its connection path is limited to HTTPS rather than full realtime WebSocket chat.</text>
</svg>
