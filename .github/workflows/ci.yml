name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/test-backend.sh

  web:
    name: Web type-check, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts skips the "postinstall: npm run build" hook; we build explicitly below.
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: bash scripts/check-web.sh

  mobile:
    name: Mobile type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npm run test:verification
        working-directory: mobile
      - run: npm run test:profile-languages
        working-directory: mobile
      - run: npm run test:people
        working-directory: mobile
      - run: npm run test:group-chats
        working-directory: mobile
      - run: npm run test:boarding-pass
        working-directory: mobile
      - run: npm run test:stickers-gifs
        working-directory: mobile
      - run: npm run test:chat-sending
        working-directory: mobile
      - run: npm run test:voice-notes
        working-directory: mobile
      - run: npm run test:message-menu
        working-directory: mobile
      - run: npm run test:corrections
        working-directory: mobile
